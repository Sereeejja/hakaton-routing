[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routing-opt"
version = "0.1.0"
description = "Routing and scheduling engine for field engineers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hackathon team" }]
dependencies = ["certifi>=2024.7.4"]

[project.optional-dependencies]
ortools = ["ortools>=9.10,<10"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]

[project.scripts]
routing-demo = "routing_opt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
